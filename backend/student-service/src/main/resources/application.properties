spring.application.name=student-service
server.address=127.0.0.1
server.port=${SERVER_PORT:8080}
spring.datasource.url=jdbc:sqlite:${STUDENT_DB_PATH:../../server/data/students.sqlite}
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=1
spring.datasource.hikari.connection-init-sql=PRAGMA foreign_keys=ON
spring.sql.init.mode=always
spring.flyway.enabled=false

school.ai.provider=${AI_PROVIDER:openai}
school.ai.openai.api-key=${OPENAI_API_KEY:}
school.ai.openai.base-url=${OPENAI_BASE_URL:https://api.openai.com/v1}
school.ai.openai.model=${OPENAI_MODEL:gpt-4o-mini}
