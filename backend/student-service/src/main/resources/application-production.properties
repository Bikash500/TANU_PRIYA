server.address=0.0.0.0
server.port=${PORT:${SERVER_PORT:8080}}
server.forward-headers-strategy=framework
server.error.include-message=never

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${DATABASE_POOL_SIZE:10}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.data-source-properties.sslmode=require

spring.sql.init.mode=never
spring.flyway.enabled=true
spring.flyway.user=${DATABASE_MIGRATION_USERNAME:${DATABASE_USERNAME}}
spring.flyway.password=${DATABASE_MIGRATION_PASSWORD:${DATABASE_PASSWORD}}

school.bootstrap-admin.email=${INITIAL_ADMIN_EMAIL:}
school.bootstrap-admin.password=${INITIAL_ADMIN_PASSWORD:}
